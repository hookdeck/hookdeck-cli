name: Acceptance Tests

# Reusable workflow: runs the acceptance suite (sliced) + telemetry acceptance
# tests. Called by test-acceptance.yml on pull requests and by release.yml as a
# gate before publishing. Callers pass secrets via `secrets: inherit`.
on:
  workflow_call:

# Serialise every acceptance run repo-wide.
#
# All callers -- pull requests, merges to main, manual dispatch, and the release
# gate -- exercise the SAME three Hookdeck projects using the same three API
# keys. The API allows 240 requests/minute and a full slice makes thousands of
# calls, so two runs overlapping exhaust the limit and both degrade.
#
# The failure is nasty because it does not look like rate limiting. It surfaces
# as ordinary assertion failures in whichever slice lost the race -- a config
# that came back empty, a filter that returned nothing -- sending whoever reads
# it hunting for a regression that does not exist. It has happened twice: once
# as four jobs timing out with zero assertion failures, and once as a single
# named test failing while a release ran concurrently.
#
# cancel-in-progress is deliberately false. Cancelling would be faster, but the
# release workflow calls this as its publish gate, and killing that run to make
# room for a pull request is the wrong trade. Queueing costs wall-clock and
# nothing else.
concurrency:
  group: acceptance-suite
  cancel-in-progress: false

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: "0"
            api_key_secret: HOOKDECK_CLI_TESTING_API_KEY
            tags: "basic guest connection source mcp listen project_use connection_list connection_upsert connection_error_hints connection_oauth_aws connection_update"
          - slice: "1"
            api_key_secret: HOOKDECK_CLI_TESTING_API_KEY_2
            tags: "request event"
          - slice: "2"
            api_key_secret: HOOKDECK_CLI_TESTING_API_KEY_3
            tags: "attempt metrics issue transformation destination gateway"
    runs-on: ubuntu-latest
    env:
      ACCEPTANCE_SLICE: ${{ matrix.slice }}
      HOOKDECK_CLI_TESTING_API_KEY: ${{ secrets[matrix.api_key_secret] }}
      # Account-wide CLI key, used only by the project list/use tests in slice 0.
      # It has to be account-wide: the project-scoped key `hookdeck ci` issues
      # gets a 403 from GET /projects, so those tests skip themselves without it.
      #
      # It must also belong to the test-only account, not to a person. Such a key
      # reaches every org its owner belongs to, and this repository is public, so
      # anything a failing test prints is world-readable. The tests are written
      # not to echo a project listing, but the account is the real control:
      # scoped to its own org, a disclosure is worth nothing.
      HOOKDECK_CLI_TESTING_CLI_KEY: ${{ secrets.HOOKDECK_CLI_TESTING_CLI_KEY }}
      HOOKDECK_CLI_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.26.6"

      - name: Run Go Acceptance Tests (slice ${{ matrix.slice }})
        run: go test -tags="${{ matrix.tags }}" ./test/acceptance/... -v -timeout 12m

  # Telemetry proxy tests require the real telemetry header; matrix jobs set
  # HOOKDECK_CLI_TELEMETRY_DISABLED=1. This job runs -tags=telemetry with
  # HOOKDECK_CLI_TELEMETRY_DISABLED=0 so telemetry is on even if the repo sets a global opt-out.
  acceptance-telemetry:
    runs-on: ubuntu-latest
    env:
      ACCEPTANCE_SLICE: "0"
      HOOKDECK_CLI_TESTING_API_KEY: ${{ secrets.HOOKDECK_CLI_TESTING_API_KEY }}
      # Explicitly allow telemetry: repo/org env may set HOOKDECK_CLI_TELEMETRY_DISABLED=1 globally.
      HOOKDECK_CLI_TELEMETRY_DISABLED: "0"
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.26.6"

      - name: Run telemetry acceptance tests
        run: go test -tags=telemetry ./test/acceptance/... -v -timeout 12m
