name: Acceptance Tests

# Reusable workflow: runs the acceptance suite (sliced) + telemetry acceptance
# tests. Called by test-acceptance.yml on pull requests and by release.yml as a
# gate before publishing. Callers pass secrets via `secrets: inherit`.
on:
  workflow_call:

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Balanced against measured per-tag runtime, not guesswork. Slice 0
          # had carried eleven tags and ran 22 minutes while slices 1 and 2
          # finished in ~5, because `mcp` alone is 10 minutes of live API calls
          # and that cost was invisible while those tests were failing fast on
          # stale tool names. Slice 3 cannot take any of the overflow: its key
          # is an Outpost project, which the Gateway tests cannot run against.
          #
          # Measured minutes per tag: mcp 10.3, connection 3.8, listen 2.9,
          # connection_upsert 2.2, source 0.8, connection_update 0.4,
          # connection_list 0.4, basic 0.4, connection_oauth_aws 0.3,
          # project_use 0.3, connection_error_hints 0.1, guest 0.0.
          # Re-measure before moving tags again: extract `--- PASS: Name (Ns)`
          # from a green run and group by each test file's build tag.
          - slice: "0"
            api_key_secret: HOOKDECK_CLI_TESTING_API_KEY
            tags: "basic guest mcp project_use"
          - slice: "1"
            api_key_secret: HOOKDECK_CLI_TESTING_API_KEY_2
            tags: "request event connection connection_list connection_update connection_oauth_aws connection_error_hints"
          - slice: "2"
            api_key_secret: HOOKDECK_CLI_TESTING_API_KEY_3
            tags: "attempt metrics issue transformation destination gateway listen source connection_upsert"
          # Outpost needs its own project: every `hookdeck outpost` command
          # requires an Outpost project, which the Gateway keys above cannot
          # satisfy. The key is a Project API key, used both to authenticate via
          # `hookdeck ci` and directly for `outpost publish`, which does not
          # accept CLI credentials.
          - slice: "3"
            api_key_secret: HOOKDECK_CLI_OUTPOST_TESTING_API_KEY
            tags: "outpost"
    runs-on: ubuntu-latest
    env:
      ACCEPTANCE_SLICE: ${{ matrix.slice }}
      HOOKDECK_CLI_TESTING_API_KEY: ${{ secrets[matrix.api_key_secret] }}
      HOOKDECK_CLI_OUTPOST_TESTING_API_KEY: ${{ secrets.HOOKDECK_CLI_OUTPOST_TESTING_API_KEY }}
      # Account-wide CLI key, used only by the project list/use tests in slice 0.
      # It has to be account-wide: the project-scoped key `hookdeck ci` issues
      # gets a 403 from GET /projects, so those tests skip themselves without it.
      #
      # It must also belong to the test-only account, not to a person. Such a key
      # reaches every org its owner belongs to, and this repository is public, so
      # anything a failing test prints is world-readable. The tests are written
      # not to echo a project listing, but the account is the real control:
      # scoped to its own org, a disclosure is worth nothing.
      HOOKDECK_CLI_TESTING_CLI_KEY: ${{ secrets.HOOKDECK_CLI_TESTING_CLI_KEY }}
      HOOKDECK_CLI_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.26.6"

      - name: Run Go Acceptance Tests (slice ${{ matrix.slice }})
        # 30m, not 12m: slice 0 timed out at exactly 720s once the MCP tests
        # started working. They had been failing instantly with
        # `unknown tool "gateway_events"` — stale names left behind by the
        # read/write split — so the slice's real cost was hidden. The suite
        # alone is ~10 minutes of live API calls.
        #
        # This is headroom, not balance: slice 0 carries eleven tags and runs
        # ~20m while slices 1 and 2 finish in 4-5m. Splitting mcp into its own
        # slice would need a fifth project API key, since a slice's key is what
        # keeps concurrent jobs off each other's records.
        run: go test -tags="${{ matrix.tags }}" ./test/acceptance/... -v -timeout 30m

  # Telemetry proxy tests require the real telemetry header; matrix jobs set
  # HOOKDECK_CLI_TELEMETRY_DISABLED=1. This job runs -tags=telemetry with
  # HOOKDECK_CLI_TELEMETRY_DISABLED=0 so telemetry is on even if the repo sets a global opt-out.
  acceptance-telemetry:
    runs-on: ubuntu-latest
    env:
      ACCEPTANCE_SLICE: "0"
      HOOKDECK_CLI_TESTING_API_KEY: ${{ secrets.HOOKDECK_CLI_TESTING_API_KEY }}
      # Explicitly allow telemetry: repo/org env may set HOOKDECK_CLI_TELEMETRY_DISABLED=1 globally.
      HOOKDECK_CLI_TELEMETRY_DISABLED: "0"
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.26.6"

      - name: Run telemetry acceptance tests
        run: go test -tags=telemetry ./test/acceptance/... -v -timeout 12m
